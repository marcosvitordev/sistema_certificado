<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Certifica CES</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-intro">
      <a class="brand brand-light" href="/validar" aria-label="Certifica CES">
        <span class="brand-mark">C</span>
        <span><strong>Certifica</strong><small>Centro de Estudo Sena</small></span>
      </a>
      <div>
        <p class="eyebrow light">Gestão de certificados</p>
        <h1>Emita, organize e valide com confiança.</h1>
        <p>Uma área segura para administrar os certificados da instituição.</p>
      </div>
      <a class="text-link light" href="/validar">Validar um certificado →</a>
    </section>
    <section class="login-panel">
      <form method="post" action="/login" class="auth-card">
        <div>
          <p class="eyebrow">Área administrativa</p>
          <h2>Bem-vindo de volta</h2>
          <p class="muted">Entre com as credenciais da instituição.</p>
        </div>
        <div id="login-error" class="alert error" role="alert" hidden></div>
        <label>Usuário
          <input name="username" autocomplete="username" maxlength="60" required autofocus>
        </label>
        <label>Senha
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="button primary full" type="submit">Entrar no sistema</button>
      </form>
    </section>
  </main>
</body>
</html>
