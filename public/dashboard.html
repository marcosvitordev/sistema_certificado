<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dashboard – CES</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <!-- SIDEBAR -->
  <aside class="fixed top-0 left-0 w-64 h-full bg-gray-900 text-white p-6">
      <h2 class="text-2xl font-bold mb-6">Sistema CES</h2>

      <nav class="space-y-3">
          <a href="/dashboard" class="block px-4 py-2 bg-gray-700 rounded">📊 Dashboard</a>
          <a href="/cadastro" class="block px-4 py-2 hover:bg-gray-700 rounded">➕ Cadastro</a>

          <form action="/logout" method="POST">
              <button class="mt-6 w-full bg-red-600 py-2 rounded hover:bg-red-700">
                  🚪 Sair
              </button>
          </form>
      </nav>
  </aside>

  <main class="ml-64 p-8">

      <h1 class="text-3xl font-bold mb-6">Lista de Alunos</h1>

      <!-- FILTROS -->
      <div class="flex gap-4 mb-4">
          <input id="input-busca" type="text" placeholder="Pesquisar aluno..."
            class="px-3 py-2 border rounded w-64">

          <input id="filtro-inicio" type="date" class="px-3 py-2 border rounded">
          <input id="filtro-fim" type="date" class="px-3 py-2 border rounded">

          <button id="btn-filtrar"
           class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
            Filtrar
          </button>
      </div>

      <!-- TABELA -->
      <div class="bg-white shadow rounded p-4">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b bg-gray-100">
              <th class="p-3">ID</th>
              <th class="p-3">Aluno</th>
              <th class="p-3">Período</th>
              <th class="p-3">QR</th>
              <th class="p-3 text-right">Ações</th>
            </tr>
          </thead>

          <tbody id="lista-alunos"></tbody>
        </table>
      </div>

      <div id="paginacao" class="flex gap-2 mt-6 justify-center"></div>

  </main>

  <script src="/js/dashboard.js"></script>

</body>
</html>
