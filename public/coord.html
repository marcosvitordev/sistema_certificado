<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Localizador de Coordenadas PDF</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f4f4;
    }
    canvas {
      border: 2px solid #333;
      cursor: crosshair;
    }
    #info {
      margin-top: 15px;
      font-size: 18px;
      background: #fff;
      padding: 10px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <h2>Clique no PDF para descobrir as coordenadas</h2>

  <canvas id="canvas"></canvas>
  <div id="info">Clique em algum ponto</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    
    const url = "certificado_modelo.pdf";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const info = document.getElementById("info");

    pdfjsLib.getDocument(url).promise.then(pdf => {
      pdf.getPage(1).then(page => {
        const scale = 1.5;
        const viewport = page.getViewport({ scale });

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        page.render({
          canvasContext: ctx,
          viewport
        });

        canvas.addEventListener("click", e => {
          const rect = canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          // Converte para sistema do PDF
          const pdfX = Math.round(x / scale);
          const pdfY = Math.round((canvas.height - y) / scale);

          info.innerHTML = `
            x: <b>${pdfX}</b> | y: <b>${pdfY}</b>
          `;
        });
      });
    });
  </script>

</body>
</html>
